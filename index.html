<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find out if today is Programmer's Day and how many days are left to celebrate it."
    />
    <meta
      name="keywords"
      content="Programmer's Day, programmer's date, 256, programming, technology events"
    />
    <meta property="og:title" content="Is it Programmer's Day?" />
    <meta
      property="og:description"
      content="Calculate if today is Programmer's Day and how many days are left."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://programmersday.martinponce.com.ar/" />
    <meta
      property="og:image"
      content="https://programmersday.martinponce.com.ar/programmersday.jpg"
    />
    <meta
      name="google-site-verification"
      content="r14YoAs2h2rCX0WBgu8b9GrEFfnDi0DO1bi2CVfBhZ8"
    />
    <link rel="icon" href="favicon.ico" />
    <title>Programmer's Day</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      .lang-selector {
        position: absolute;
        top: 10px;
        right: 10px;
      }
    </style>
  </head>
  <body>
    <select id="lang" class="lang-selector" onchange="changeLanguage()">
      <option value="es">Español</option>
      <option value="en">English</option>
    </select>

    <h1 id="titulo"></h1>
    <p id="resultado"></p>

    <script>
      function getLanguage() {
        const lang =
          localStorage.getItem('lang') ||
          (navigator.language.startsWith('es') ? 'es' : 'en');
        document.getElementById('lang').value = lang;
        return lang;
      }

      function changeLanguage() {
        const selectedLanguage = document.getElementById('lang').value;
        localStorage.setItem('lang', selectedLanguage);
        updateProgrammersDay();
      }

      function updateProgrammersDay() {
        const today = new Date();
        const currentYear = today.getFullYear();
        const programmersDayThisYear = new Date(currentYear, 0, 256);
        const lang = getLanguage().startsWith('es') ? 'es' : 'en';
        const messages = {
          es: {
            title: '¿Es el Día del Programador?',
            yes: '¡Sí! Hoy es el Día del Programador 🎉',
            no: 'No, faltan {d} días para el Día del Programador.',
            missed:
              'Fue hace {d} días... y seguro te olvidaste de saludar a tu amigo programador 😔',
            missedSingle:
              'Fue ayer... y seguro te olvidaste de saludar a tu amigo programador 😔',
          },
          en: {
            title: "Is it Programmer's Day?",
            yes: "Yes! Today is Programmer's Day 🎉",
            no: "No, there are {d} days left until Programmer's Day.",
            missed:
              "It was {d} days ago... and you probably forgot to wish your programmer friend a happy Programmer's Day 😔",
            missedSingle:
              "It was yesterday... and you probably forgot to wish your programmer friend a happy Programmer's Day 😔",
          },
        };

        document.getElementById('titulo').innerText = messages[lang].title;

        // Programmer's Day is today
        if (today.toDateString() === programmersDayThisYear.toDateString()) {
          document.getElementById('resultado').innerText = messages[lang].yes;
          return;
        }

        // Programmer's Day already happened this year
        if (today > programmersDayThisYear) {
          const daysSince = Math.floor(
            (today - programmersDayThisYear) / (1000 * 60 * 60 * 24),
          );

          if (daysSince === 1) {
            document.getElementById('resultado').innerText =
              messages[lang].missedSingle;
            return;
          }

          if (daysSince <= 15) {
            document.getElementById('resultado').innerText = messages[
              lang
            ].missed.replace('{d}', daysSince);
            return;
          }

          // More than 15 days have passed: calculate next Programmer's Day
          const nextProgrammersDay = new Date(currentYear + 1, 0, 256);
          const daysUntilNext = Math.ceil(
            (nextProgrammersDay - today) / (1000 * 60 * 60 * 24),
          );
          document.getElementById('resultado').innerText = messages[
            lang
          ].no.replace('{d}', daysUntilNext);
          return;
        }

        // Programmer's Day hasn't happened yet this year
        const daysUntil = Math.ceil(
          (programmersDayThisYear - today) / (1000 * 60 * 60 * 24),
        );

        document.getElementById('resultado').innerText = messages[
          lang
        ].no.replace('{d}', daysUntil);
      }

      updateProgrammersDay();
    </script>
  </body>
</html>
